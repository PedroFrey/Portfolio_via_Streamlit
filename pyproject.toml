[project]
name = "portfolio-via-streamlit"
version = "0.2.0"
description = "Portfólio pessoal em Streamlit — showcase de mini-apps de dados"
authors = [{ name = "P Frey", email = "pedro.frey@email.com" }]
requires-python = ">=3.11,<4.0"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "streamlit>=1.38,<2.0",
    "pandas>=2.2,<3.0",
    "plotly>=5.22,<6.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "structlog>=24.1,<27.0",
    "sentry-sdk>=2.5,<3.0",
    "tenacity>=8.3,<9.0",
    "babel>=2.15,<3.0",
    "requests>=2.32,<3.0",
    "streamlit-lottie>=0.0.5,<0.1.0",
    "Pillow>=11.0,<12.0",
]

[project.optional-dependencies]
analytics = ["posthog>=3.5,<4.0"]

[dependency-groups]
dev = [
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
    "hypothesis>=6.108,<7.0",
    "pre-commit>=3.7,<4.0",
    "bandit[toml]>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Portfolio_via_Streamlit"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["Portfolio_via_Streamlit"]

[tool.mypy]
# Nota: mesmo com requires-python >=3.11, o target aqui é 3.12 porque o
# NumPy 2.5+ (dependência transitiva do pandas) usa sintaxe PEP 695 em seus
# stubs, o que quebra o parser do mypy quando o target é 3.11. O código do
# projeto continua compatível com 3.11 em runtime — isso afeta só a análise
# estática dos stubs de terceiros.
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "Portfolio_via_Streamlit.domain.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["Portfolio_via_Streamlit/tests"]
addopts = "-ra --cov=Portfolio_via_Streamlit --cov-report=term-missing"

[tool.coverage.run]
omit = ["Portfolio_via_Streamlit/tests/*"]

[tool.bandit]
exclude_dirs = ["Portfolio_via_Streamlit/tests"]
